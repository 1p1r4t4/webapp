<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de Tablas de Multiplicar</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #2d3748;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #2b6cb0;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #edf2f7;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .score-box { color: #2f855a; }
        .timer-box { color: #c53030; }

        .problem-display {
            font-size: 48px;
            font-weight: 800;
            margin: 25px 0;
            color: #1a202c;
            letter-spacing: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 18px;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(49, 130, 206, 0.3);
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn.correct {
            background: #38a169 !important;
            box-shadow: 0 4px 6px rgba(56, 161, 105, 0.4);
        }

        .option-btn.wrong {
            background: #e53e3e !important;
            box-shadow: 0 4px 6px rgba(229, 62, 62, 0.4);
        }

        .btn-main {
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px 32px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(72, 187, 120, 0.3);
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .streak-badge {
            display: inline-block;
            background: #feebc8;
            color: #c05621;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            visibility: hidden;
        }

        .streak-badge.visible {
            visibility: visible;
        }

        .hidden {
            display: none !important;
        }

        .results-title {
            font-size: 32px;
            color: #2b6cb0;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 50px;
            font-weight: bold;
            color: #2f855a;
            margin: 15px 0;
        }

        .stars {
            font-size: 40px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- START SCREEN -->
    <div id="start-screen">
        <h1>🚀 Reto de las Tablas</h1>
        <p style="font-size: 18px; color: #4a5568; margin-bottom: 25px;">
            ¡Responde tantas multiplicaciones como puedas antes de que se agote el tiempo!
        </p>
        <button class="btn-main" onclick="startGame()">¡EMPEZAR JUEGO!</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <div class="stats-bar">
            <div class="score-box">Puntos: <span id="score">0</span></div>
            <div class="timer-box">⏱️ <span id="timer">60</span>s</div>
        </div>

        <div id="streak" class="streak-badge">🔥 Racha: <span id="streak-count">0</span></div>

        <div class="problem-display" id="problem">7 × 8</div>

        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(this)"></button>
            <button class="option-btn" onclick="checkAnswer(this)"></button>
            <button class="option-btn" onclick="checkAnswer(this)"></button>
            <button class="option-btn" onclick="checkAnswer(this)"></button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="hidden">
        <div class="results-title">¡Tiempo agotado! 🎉</div>
        <div class="stars" id="stars">⭐⭐⭐</div>
        <p style="font-size: 18px; margin: 0; color: #718096;">Tu puntuación final:</p>
        <div class="final-score" id="final-score">0</div>
        <p id="feedback-msg" style="font-size: 18px; margin-bottom: 25px; font-weight: bold; color: #4a5568;"></p>
        <button class="btn-main" onclick="startGame()">JUGAR DE NUEVO 🔄</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;
    let currentCorrectAnswer = 0;
    let streak = 0;
    let isClickable = true;

    function startGame() {
        score = 0;
        timeLeft = 60;
        streak = 0;
        isClickable = true;

        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('streak-count').innerText = streak;
        document.getElementById('streak').classList.remove('visible');

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        nextQuestion();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function nextQuestion() {
        isClickable = true;
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        currentCorrectAnswer = num1 * num2;

        document.getElementById('problem').innerText = `${num1} × ${num2}`;

        // Generate options
        let options = new Set();
        options.add(currentCorrectAnswer);

        while (options.size < 4) {
            let wrong;
            const randType = Math.random();
            if (randType < 0.4) {
                // Close answer
                wrong = currentCorrectAnswer + (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1);
            } else if (randType < 0.7) {
                // Table shift
                wrong = num1 * (num2 + (Math.random() < 0.5 ? 1 : -1));
            } else {
                // Random nearby
                wrong = (Math.floor(Math.random() * 10) + 1) * (Math.floor(Math.random() * 10) + 1);
            }

            if (wrong > 0 && wrong !== currentCorrectAnswer) {
                options.add(wrong);
            }
        }

        const optionsArray = Array.from(options);
        // Shuffle array
        optionsArray.sort(() => Math.random() - 0.5);

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, index) => {
            btn.innerText = optionsArray[index];
            btn.className = 'option-btn';
        });
    }

    function checkAnswer(selectedBtn) {
        if (!isClickable) return;
        isClickable = false;

        const selectedVal = parseInt(selectedBtn.innerText);

        if (selectedVal === currentCorrectAnswer) {
            selectedBtn.classList.add('correct');
            streak++;
            score += 10 + (streak > 2 ? 5 : 0); // Bonus for streak
            document.getElementById('score').innerText = score;

            if (streak >= 3) {
                document.getElementById('streak-count').innerText = streak;
                document.getElementById('streak').classList.add('visible');
            }

            setTimeout(() => {
                nextQuestion();
            }, 300);
        } else {
            selectedBtn.classList.add('wrong');
            streak = 0;
            document.getElementById('streak').classList.remove('visible');

            // Show correct answer
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                if (parseInt(btn.innerText) === currentCorrectAnswer) {
                    btn.classList.add('correct');
                }
            });

            setTimeout(() => {
                nextQuestion();
            }, 800);
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = score;

        let starsText = '⭐';
        let feedback = '¡Buen intento! Sigue practicando.';

        if (score >= 150) {
            starsText = '⭐⭐⭐';
            feedback = '¡INCREÍBLE! ¡Eres un maestro de las tablas!';
        } else if (score >= 80) {
            starsText = '⭐⭐';
            feedback = '¡Muy bien! ¡Buen trabajo!';
        }

        document.getElementById('stars').innerText = starsText;
        document.getElementById('feedback-msg').innerText = feedback;
    }
</script>

</body>
</html>
